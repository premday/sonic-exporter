[supervisord]
nodaemon=true
silent=true
logfile=/dev/stderr
logfile_maxbytes=0
pidfile=/run/sonic-supervisor/supervisord.pid

[unix_http_server]
file=/run/sonic-supervisor/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/sonic-supervisor/supervisor.sock

[program:sonic-exporter]
command=/app/sonic-exporter --path.rootfs="%(ENV_SONIC_EXPORTER_ROOTFS)s" --web.listen-address="%(ENV_SONIC_EXPORTER_LISTEN_ADDRESS)s" --web.vrf="%(ENV_SONIC_EXPORTER_WEB_VRF)s"
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
