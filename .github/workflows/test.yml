name: 'Run go tests'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
jobs:
  go-test:
    name: go-test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.13', '1.27.x']
    steps:
      - uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: test VRF listener with shuffled order
        run: go test -race -shuffle=on -count=1 ./cmd/sonic-exporter
      - name: run full Go test suite
        run: go test -race -count=1 ./...
  go-test-required:
    name: go-test
    needs: go-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: require Go test matrix
        env:
          GO_TEST_RESULT: ${{ needs.go-test.result }}
        run: test "${GO_TEST_RESULT}" = "success"
  validate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate dashboard JSON
        run: ./scripts/validate-dashboard.sh dashboards/sonic-exporter.json
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: false
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
      - name: install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest
      - name: gitleaks scan working tree
        run: gitleaks detect --no-git --redact --source .
  docker-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: smoke Docker image
        run: scripts/smoke-image.sh
